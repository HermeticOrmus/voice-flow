name: Bug report
description: Something does not work as the README says.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Your system
      description: Distribution, compositor and version, and the output of the check command named in the README.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "For example: journalctl --user -u <service> -n 50"
      render: text
