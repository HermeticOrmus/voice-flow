# voice-flow per-app rewrite profiles.
# One rule per line: "<app_id glob>  <profile>". First match wins.
# Profiles: verbatim = raw whisper transcript, no LLM rewrite
#           clean    = the Express clean-up (prompt by default); every
#                      unlisted app gets it
#
# Find an app's id with:  hyprctl activewindow -j | jq -r .class
#
# Terminals take the clean-up too (Ormus, 2026-10-29: "it's always going
# to be prompting"). The prompt style keeps paths, flags and identifiers
# verbatim. To dictate raw into one app, list it here; for one take,
# switch Express to Verbatim in the panel. Example:
# foot                        verbatim
