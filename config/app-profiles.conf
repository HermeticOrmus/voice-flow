# voice-flow per-app rewrite profiles.
# One rule per line: "<app_id glob>  <profile>". First match wins.
# Profiles: verbatim = raw whisper transcript, no LLM rewrite
#           clean    = full cleanup rewrite (the default for unlisted apps)
#
# Find an app's id with:  ormus-active-window --list
#
# Terminals: an LLM pass mangles paths, flags, and identifiers — the
# transcript goes in verbatim (whisper vocabulary biasing still applies).
solutions.ormus.OrmusTerm   verbatim
com.system76.CosmicTerm     verbatim
Alacritty                   verbatim
kitty                       verbatim
org.wezfurlong.wezterm      verbatim
foot                        verbatim
org.ormus.workboard.*       verbatim
com.mitchellh.ghostty       verbatim
org.gnome.Terminal          verbatim
org.kde.konsole             verbatim
